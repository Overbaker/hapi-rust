[package]
name = "hapi-session-wrapper"
version = "0.1.0"
edition = "2021"

[dependencies]
hapi-wrapper-core = { path = "../hapi-wrapper-core" }
tokio = { version = "1.54", features = ["rt", "io-util", "macros", "process", "sync", "time"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
regex-lite = "0.1"
tempfile = "3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"

[dev-dependencies]
proptest = "1.12"
tokio = { version = "1.54", features = ["test-util"] }

[lib]
path = "src/cli.rs"

[[test]]
name = "codex_version_gate"
path = "src/flavors/codex/version_gate_test.rs"

[[test]]
name = "shared_runtime_e2e"
path = "src/flavors/codex/shared_runtime_e2e.rs"
