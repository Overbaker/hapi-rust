[package]
name = "hapi-session-wrapper"
version = "0.1.0"
edition = "2021"
build = "src/flavors/claude/build_version.rs"

[dependencies]
hapi-wrapper-core = { path = "../hapi-wrapper-core" }
tokio = { version = "1.54", features = ["rt", "io-util", "macros", "process", "sync", "time"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"
base64 = "0.22"

[dev-dependencies]
proptest = "1.12"
tokio = { version = "1.54", features = ["test-util"] }

[lib]
path = "src/cli.rs"

[[test]]
name = "parser_parity"
path = "src/flavors/claude/parser_parity.rs"

[[test]]
name = "session_e2e"
path = "src/flavors/claude/session_e2e.rs"
