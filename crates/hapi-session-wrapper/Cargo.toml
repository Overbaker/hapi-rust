[package]
name = "hapi-session-wrapper"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Low-memory (4.4 MiB) Rust session wrapper for running 100+ local Claude Code, Codex, Antigravity, and Pi sessions with HAPI"
repository = "https://github.com/Overbaker/hapi-rust"
homepage = "https://overbaker.github.io/hapi-rust/"
keywords = ["claude-code", "codex", "ai-agents", "remote-control", "session-wrapper"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
hapi-wrapper-core = { path = "../hapi-wrapper-core" }
tokio = { version = "1.54", features = ["rt", "io-util", "macros", "process", "sync", "time"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"
base64 = "0.22"

regex-lite = "0.1"
tempfile = "3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
indexmap = { version = "2", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1.12"
tokio = { version = "1.54", features = ["test-util"] }

[[test]]
name = "parser_parity"
path = "src/flavors/claude/parser_parity.rs"

[[test]]
name = "session_e2e"
path = "src/flavors/claude/session_e2e.rs"

[[test]]
name = "codex_version_gate"
path = "src/flavors/codex/version_gate_test.rs"

[[test]]
name = "shared_runtime_e2e"
path = "src/flavors/codex/shared_runtime_e2e.rs"
