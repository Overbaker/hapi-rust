[package]
name = "hapi-wrapper-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.54", features = ["rt", "macros", "net", "time", "sync", "fs", "process", "signal", "io-util", "io-std"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"], default-features = false }
rustls = { version = "0.23", features = ["ring", "std", "tls12"], default-features = false }
rustls-native-certs = "0.8"
hyper = { version = "1.12", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1", "server"] }
hyper-rustls = { version = "0.27", features = ["http1"], default-features = false }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
futures-util = { version = "0.3", features = ["sink", "std"], default-features = false }
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
regex-lite = "0.1"
sha2 = "0.11"
base64 = "0.22"
yaml-rust2 = { version = "0.13.0", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", features = ["signal", "hostname", "fs", "process", "term"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio = { version = "1.54", features = ["test-util", "process", "io-util", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", features = ["ring"], default-features = false }
proptest = "1.12"
tempfile = "3"
