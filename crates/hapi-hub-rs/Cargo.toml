[package]
name = "hapi-hub-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
bytes = "1"
dashmap = "6"
flate2 = "1"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.13"
