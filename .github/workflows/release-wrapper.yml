name: Release wrapper
run-name: ${{ inputs.ref && format('release-wrapper {0}', inputs.ref) || github.event.head_commit.message }}

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Full commit sha to build
                required: true
                type: string
    push:
        branches:
            - ci/release-wrapper
        paths:
            - .github/release-ref
            - .github/workflows/release-wrapper.yml

permissions:
    contents: read

jobs:
    build:
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - arch: x64
                      runner: ubuntu-latest
                      pattern: x86-64
                    - arch: arm64
                      runner: ubuntu-24.04-arm
                      pattern: aarch64
                    - arch: windows-x64
                      runner: windows-latest
                      pattern: PE32\+.*x86-64
                      suffix: .exe
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Resolve ref
              id: ref
              env:
                  INPUT_REF: ${{ inputs.ref }}
                  PUSH_MESSAGE: ${{ github.event.head_commit.message }}
                  REF_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.github/release-ref
              run: |
                  ref=$INPUT_REF
                  if [[ -z $ref && $PUSH_MESSAGE =~ ^release-wrapper\ ([0-9a-f]{40})$ ]]; then ref=${BASH_REMATCH[1]}; fi
                  if [[ -z $ref ]]; then ref=$(curl -fsSL "$REF_URL" | tr -d '[:space:]'); fi
                  [[ $ref =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full commit sha"; exit 1; }
                  echo "sha=$ref" >>"$GITHUB_OUTPUT"
            - uses: actions/checkout@v4
              with:
                  ref: ${{ steps.ref.outputs.sha }}
            - name: Build
              env:
                  HAPI_WRAPPER_GIT_SHA: ${{ steps.ref.outputs.sha }}
              run: |
                  [[ $(git rev-parse HEAD) == "${{ steps.ref.outputs.sha }}" ]]
                  if [[ $RUNNER_OS == Windows ]]; then rustup override set stable-x86_64-pc-windows-msvc; fi
                  cargo build --locked --release -p hapi-session-wrapper
            - name: Inspect
              run: |
                  mkdir out
                  exe=hapi-session-wrapper${{ matrix.suffix }}
                  cp "target/release/$exe" out/
                  cd out
                  "./$exe" --version | tee version.txt
                  rustc --version | tee rustc.txt
                  echo "${{ steps.ref.outputs.sha }}" >ref.txt
                  file "$exe" | tee file.txt
                  grep -Eq '${{ matrix.pattern }}' file.txt
                  sha256sum "$exe" | tee hapi-session-wrapper.sha256
            - uses: actions/upload-artifact@v4
              with:
                  name: hapi-session-wrapper-${{ matrix.arch }}
                  path: out/
                  if-no-files-found: error
                  retention-days: 30
